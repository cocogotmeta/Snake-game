<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NOIR — Snake</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --gold:#d8b56a;
    --goldLight:#f5dda0;
    --black:#030303;
}

html,body{
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 50% -10%,rgba(216,181,106,.14),transparent 35%),
        #030303;
    color:white;
    font-family:Inter,Arial,sans-serif;
}

.bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
}

.orb{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.1;
    animation:orb 14s ease-in-out infinite alternate;
}

.orb1{
    background:#d8b56a;
    left:-180px;
    top:-180px;
}

.orb2{
    background:#8c5e18;
    right:-180px;
    bottom:-180px;
    animation-delay:-6s;
}

@keyframes orb{
    to{
        transform:translate(80px,50px) scale(1.15);
    }
}

/* INTRO */

.intro{
    position:fixed;
    inset:0;
    z-index:100;
    background:#020202;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:opacity 1s ease,visibility 1s ease;
}

.intro.hide{
    opacity:0;
    visibility:hidden;
}

.introInner{
    text-align:center;
    animation:intro .9s cubic-bezier(.2,.8,.2,1);
}

@keyframes intro{
    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.introSmall{
    font-size:9px;
    letter-spacing:7px;
    color:var(--gold);
    margin-bottom:16px;
}

.introLogo{
    font-family:"Playfair Display",serif;
    font-size:clamp(60px,15vw,110px);
    letter-spacing:12px;
    background:linear-gradient(
        110deg,
        #795720,
        #fff1b5,
        #b7893e
    );
    -webkit-background-clip:text;
    color:transparent;
}

.introLine{
    width:0;
    height:1px;
    margin:22px auto 0;
    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
    animation:line 1.2s ease .3s forwards;
}

@keyframes line{
    to{width:190px}
}

/* PAGE */

.page{
    width:min(720px,100%);
    margin:auto;
    padding:28px 16px 35px;
    opacity:0;
    transform:translateY(20px);
    transition:1s ease;
}

.page.show{
    opacity:1;
    transform:none;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:26px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brandMark{
    width:38px;
    height:38px;
    border:1px solid rgba(216,181,106,.25);
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--goldLight);
    background:rgba(255,255,255,.025);
}

.brandName{
    font-family:"Playfair Display",serif;
    letter-spacing:3px;
    font-size:20px;
}

.brandSub{
    color:#555;
    font-size:7px;
    letter-spacing:3px;
    margin-top:3px;
}

.online{
    display:flex;
    gap:7px;
    align-items:center;
    font-size:8px;
    color:#666;
    letter-spacing:2px;
}

.dot{
    width:6px;
    height:6px;
    background:#7dff9d;
    border-radius:50%;
    box-shadow:0 0 13px #7dff9d;
    animation:blink 1.8s infinite;
}

@keyframes blink{
    50%{
        opacity:.3;
        transform:scale(.65);
    }
}

/* HERO */

.hero{
    text-align:center;
    margin-bottom:21px;
}

.eyebrow{
    font-size:8px;
    letter-spacing:6px;
    color:var(--gold);
    margin-bottom:8px;
}

.hero h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(40px,10vw,62px);
    line-height:1;
}

.hero p{
    margin-top:10px;
    color:#666;
    font-size:10px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:11px;
}

.stat{
    padding:13px 7px;
    border:1px solid rgba(216,181,106,.14);
    border-radius:15px;
    background:rgba(255,255,255,.025);
    backdrop-filter:blur(15px);
    text-align:center;
}

.statLabel{
    color:#555;
    font-size:7px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.statValue{
    font-size:17px;
    font-weight:700;
}

/* GAME */

.frame{
    padding:6px;
    border-radius:25px;
    background:
        linear-gradient(
            140deg,
            rgba(246,217,149,.55),
            rgba(216,181,106,.05) 30%,
            rgba(255,255,255,.04) 70%,
            rgba(216,181,106,.4)
        );
    box-shadow:
        0 30px 100px rgba(0,0,0,.8),
        0 0 70px rgba(216,181,106,.05);
}

.game{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:#050805;
}

canvas{
    width:100%;
    aspect-ratio:1;
    display:block;
    touch-action:none;
}

/* GAME OVER */

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(13px);
    opacity:0;
    pointer-events:none;
    transition:.5s ease;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}

.overlaySmall{
    font-size:8px;
    color:var(--gold);
    letter-spacing:5px;
    margin-bottom:9px;
}

.overlay h2{
    font-family:"Playfair Display",serif;
    font-size:45px;
}

.final{
    color:#666;
    font-size:10px;
    margin:9px 0 21px;
}

.final strong{
    color:white;
}

.play{
    border:0;
    padding:13px 28px;
    border-radius:999px;
    font-weight:800;
    letter-spacing:1px;
    background:linear-gradient(
        110deg,
        #8b6528,
        #f5d994,
        #a77d31
    );
    color:#080604;
    cursor:pointer;
    transition:.2s;
}

.play:active{
    transform:scale(.94);
}

/* CONTROLS */

.controls{
    width:180px;
    margin:17px auto 0;
    display:grid;
    grid-template-columns:repeat(3,55px);
    grid-template-rows:repeat(2,55px);
    gap:7px;
}

.control{
    border:1px solid rgba(216,181,106,.13);
    background:rgba(255,255,255,.035);
    border-radius:16px;
    display:grid;
    place-items:center;
    color:#b9914a;
    font-size:18px;
    user-select:none;
    transition:.12s;
}

.control:active{
    transform:scale(.9);
    background:rgba(216,181,106,.15);
}

.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}

.tip{
    text-align:center;
    margin-top:12px;
    color:#444;
    font-size:8px;
    letter-spacing:2px;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#292929;
    font-size:8px;
    letter-spacing:3px;
}
</style>
</head>

<body>

<div class="bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
</div>

<div class="intro" id="intro">
    <div class="introInner">
        <div class="introSmall">A DIGITAL EXPERIENCE</div>
        <div class="introLogo">NOIR</div>
        <div class="introLine"></div>
    </div>
</div>

<main class="page" id="page">

<header class="header">

    <div class="brand">

        <div class="brandMark">✦</div>

        <div>
            <div class="brandName">NOIR</div>
            <div class="brandSub">CLASSIC ARCADE</div>
        </div>

    </div>

    <div class="online">
        <span class="dot"></span>
        ONLINE
    </div>

</header>

<section class="hero">

    <div class="eyebrow">THE CLASSIC</div>

    <h1>Snake.</h1>

    <p>Start slow. Grow. Then survive.</p>

</section>

<section class="stats">

    <div class="stat">
        <div class="statLabel">SCORE</div>
        <div class="statValue" id="score">000</div>
    </div>

    <div class="stat">
        <div class="statLabel">BEST</div>
        <div class="statValue" id="best">000</div>
    </div>

    <div class="stat">
        <div class="statLabel">PACE</div>
        <div class="statValue" id="pace">SLOW</div>
    </div>

</section>

<div class="frame">

<div class="game">

<canvas id="canvas"></canvas>

<div class="overlay" id="overlay">

    <div class="overlaySmall">RUN COMPLETE</div>

    <h2>GAME OVER</h2>

    <div class="final">
        FINAL SCORE:
        <strong id="finalScore">000</strong>
    </div>

    <button class="play" id="play">
        PLAY AGAIN
    </button>

</div>

</div>

</div>

<div class="controls">

    <div class="control up" data-dir="up">↑</div>
    <div class="control left" data-dir="left">←</div>
    <div class="control down" data-dir="down">↓</div>
    <div class="control right" data-dir="right">→</div>

</div>

<div class="tip">
    SWIPE OR USE ARROW KEYS
</div>

<div class="footer">
    NOIR DIGITAL · 2026
</div>

</main>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const intro=document.getElementById("intro");
const page=document.getElementById("page");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const paceEl=document.getElementById("pace");

const overlay=document.getElementById("overlay");
const finalScore=document.getElementById("finalScore");
const play=document.getElementById("play");

const GRID=24;

let cell=0;
let snake=[];
let food={};

let direction={x:1,y:0};
let nextDirection={x:1,y:0};

let score=0;

let best=Number(
    localStorage.getItem("noirSnakeBest")||0
);

/*
    IMPORTANT:
    Much slower start.

    Old:
    ~180ms

    New:
    300ms
*/

let moveInterval=300;

let accumulator=0;
let lastTime=0;

let running=true;

let particles=[];
let popups=[];

let touchStartX=0;
let touchStartY=0;

bestEl.textContent=
    String(best).padStart(3,"0");

/* INTRO */

setTimeout(()=>{

    intro.classList.add("hide");

    setTimeout(()=>{
        page.classList.add("show");
    },300);

},2200);

/* RESIZE */

function resize(){

    const rect=canvas.getBoundingClientRect();

    const dpr=Math.min(
        window.devicePixelRatio||1,
        2
    );

    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

    cell=rect.width/GRID;
}

window.addEventListener(
    "resize",
    resize
);

/* START */

function start(){

    /*
        Small snake.
    */

    snake=[
        {x:12,y:12},
        {x:11,y:12},
        {x:10,y:12}
    ];

    direction={x:1,y:0};
    nextDirection={x:1,y:0};

    score=0;

    /*
        Very relaxed beginning.
    */

    moveInterval=300;

    accumulator=0;

    particles=[];
    popups=[];

    food=randomFood();

    running=true;

    overlay.classList.remove("show");

    updateUI();

    lastTime=performance.now();
}

/* FOOD */

function randomFood(){

    let p;

    do{

        p={
            x:Math.floor(
                Math.random()*GRID
            ),
            y:Math.floor(
                Math.random()*GRID
            )
        };

    }while(
        snake.some(
            s=>s.x===p.x&&s.y===p.y
        )
    );

    return p;
}

/* DIRECTION */

function changeDirection(dir){

    if(!running)return;

    const opposite={
        up:"down",
        down:"up",
        left:"right",
        right:"left"
    };

    const current=
        direction.x===1?"right":
        direction.x===-1?"left":
        direction.y===1?"down":"up";

    if(opposite[current]===dir)
        return;

    if(dir==="up")
        nextDirection={x:0,y:-1};

    if(dir==="down")
        nextDirection={x:0,y:1};

    if(dir==="left")
        nextDirection={x:-1,y:0};

    if(dir==="right")
        nextDirection={x:1,y:0};
}

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowUp")
            changeDirection("up");

        if(e.key==="ArrowDown")
            changeDirection("down");

        if(e.key==="ArrowLeft")
            changeDirection("left");

        if(e.key==="ArrowRight")
            changeDirection("right");

        if(e.key===" "&&!running)
            start();

    }
);

document.querySelectorAll(
    ".control"
).forEach(btn=>{

    btn.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            changeDirection(
                btn.dataset.dir
            );

        }
    );
});

/* SWIPE */

canvas.addEventListener(
    "touchstart",
    e=>{

        const t=e.touches[0];

        touchStartX=t.clientX;
        touchStartY=t.clientY;

    },
    {passive:true}
);

canvas.addEventListener(
    "touchend",
    e=>{

        const t=e.changedTouches[0];

        const dx=
            t.clientX-touchStartX;

        const dy=
            t.clientY-touchStartY;

        if(
            Math.max(
                Math.abs(dx),
                Math.abs(dy)
            )<25
        )return;

        if(
            Math.abs(dx)>
            Math.abs(dy)
        ){

            changeDirection(
                dx>0?"right":"left"
            );

        }else{

            changeDirection(
                dy>0?"down":"up"
            );
        }

    },
    {passive:true}
);

/* UPDATE */

function update(){

    direction=nextDirection;

    const head={
        x:snake[0].x+direction.x,
        y:snake[0].y+direction.y
    };

    if(
        head.x<0||
        head.x>=GRID||
        head.y<0||
        head.y>=GRID
    ){

        gameOver();
        return;
    }

    if(
        snake.some(
            s=>s.x===head.x&&s.y===head.y
        )
    ){

        gameOver();
        return;
    }

    snake.unshift(head);

    if(
        head.x===food.x&&
        head.y===food.y
    ){

        score++;

        /*
          Very gradual acceleration.

          Starts 300ms.
          Decreases only 8ms per food.
          Minimum 115ms.
        */

        moveInterval=Math.max(
            115,
            300-score*8
        );

        createBurst(
            food.x*cell+cell/2,
            food.y*cell+cell/2
        );

        popups.push({
            x:food.x*cell+cell/2,
            y:food.y*cell+cell/2,
            life:1
        });

        food=randomFood();

        updateUI();

    }else{

        snake.pop();
    }
}

/* UI */

function updateUI(){

    scoreEl.textContent=
        String(score).padStart(3,"0");

    bestEl.textContent=
        String(
            Math.max(best,score)
        ).padStart(3,"0");

    if(score<5)
        paceEl.textContent="SLOW";

    else if(score<10)
        paceEl.textContent="CALM";

    else if(score<20)
        paceEl.textContent="QUICK";

    else
        paceEl.textContent="FAST";
}

/* GAME OVER */

function gameOver(){

    running=false;

    finalScore.textContent=
        String(score).padStart(3,"0");

    if(score>best){

        best=score;

        localStorage.setItem(
            "noirSnakeBest",
            best
        );
    }

    createBurst(
        snake[0].x*cell+cell/2,
        snake[0].y*cell+cell/2,
        40
    );

    setTimeout(()=>{
        overlay.classList.add("show");
    },400);
}

play.addEventListener(
    "click",
    start
);

/* PARTICLES */

function createBurst(x,y,count=20){

    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
            Math.random()*Math.PI*2;

        const velocity=
            Math.random()*3+1;

        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle)*
                velocity,

            vy:
                Math.sin(angle)*
                velocity,

            life:1,

            size:
                Math.random()*3+1
        });
    }
}

function updateParticles(){

    particles.forEach(p=>{

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.95;
        p.vy*=.95;

        p.life-=.035;

    });

    particles=
        particles.filter(
            p=>p.life>0
        );

    popups.forEach(p=>{

        p.y-=.6;
        p.life-=.035;

    });

    popups=
        popups.filter(
            p=>p.life>0
        );
}

/* BACKGROUND */

function drawBackground(){

    const w=canvas.clientWidth;
    const h=canvas.clientHeight;

    ctx.fillStyle="#050805";

    ctx.fillRect(
        0,0,w,h
    );

    ctx.strokeStyle=
        "rgba(216,181,106,.045)";

    for(
        let i=0;
        i<=GRID;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            i*cell,
            0
        );

        ctx.lineTo(
            i*cell,
            h
        );

        ctx.stroke();

        ctx.beginPath();

        ctx.moveTo(
            0,
            i*cell
        );

        ctx.lineTo(
            w,
            i*cell
        );

        ctx.stroke();
    }

    const glow=
        ctx.createRadialGradient(
            w/2,
            h/2,
            0,
            w/2,
            h/2,
            w*.72
        );

    glow.addColorStop(
        0,
        "rgba(216,181,106,.065)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=glow;

    ctx.fillRect(
        0,0,w,h
    );
}

/* FOOD */

function drawFood(time){

    const x=
        food.x*cell+cell/2;

    const y=
        food.y*cell+cell/2;

    const pulse=
        1+
        Math.sin(time*.006)*.1;

    ctx.save();

    ctx.shadowColor=
        "#e2bc65";

    ctx.shadowBlur=28;

    const g=
        ctx.createRadialGradient(
            x-cell*.08,
            y-cell*.1,
            1,
            x,
            y,
            cell*.34
        );

    g.addColorStop(
        0,
        "#fff2bd"
    );

    g.addColorStop(
        .25,
        "#e8c36f"
    );

    g.addColorStop(
        1,
        "#805c23"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        cell*.25*pulse,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    /* orbit */

    const a=time*.0025;

    ctx.fillStyle=
        "#fff0b5";

    ctx.beginPath();

    ctx.arc(
        x+
        Math.cos(a)*
        cell*.38,

        y+
        Math.sin(a)*
        cell*.38,

        1.4,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================
   SMOOTH SNAKE RENDERING
========================= */

function drawSnake(){

    /*
      The actual grid movement remains classic,
      but each segment is rendered between its
      previous and current position.

      This removes the harsh visual jumping.
    */

    snake.forEach(
        (part,index)=>{

            const x=
                part.x*cell;

            const y=
                part.y*cell;

            const pad=
                cell*.075;

            const size=
                cell*.85;

            const gradient=
                ctx.createLinearGradient(
                    x,
                    y,
                    x+cell,
                    y+cell
                );

            if(index===0){

                gradient.addColorStop(
                    0,
                    "#fff0b5"
                );

                gradient.addColorStop(
                    .2,
                    "#e8c16b"
                );

                gradient.addColorStop(
                    .55,
                    "#c2943d"
                );

                gradient.addColorStop(
                    1,
                    "#6d4e1f"
                );

            }else{

                gradient.addColorStop(
                    0,
                    "#dfbd69"
                );

                gradient.addColorStop(
                    .5,
                    "#a77a31"
                );

                gradient.addColorStop(
                    1,
                    "#5e441d"
                );
            }

            ctx.save();

            ctx.shadowColor=
                index===0
                ?"rgba(246,217,149,.45)"
                :"rgba(216,181,106,.16)";

            ctx.shadowBlur=
                index===0?18:7;

            ctx.fillStyle=gradient;

            roundedRect(
                x+pad,
                y+pad,
                size,
                size,
                cell*.23
            );

            ctx.fill();

            ctx.restore();

            ctx.fillStyle=
                "rgba(255,255,255,.18)";

            ctx.beginPath();

            ctx.arc(
                x+cell*.29,
                y+cell*.27,
                cell*.06,
                0,
                Math.PI*2
            );

            ctx.fill();

            if(index===0){

                drawEyes(
                    x+cell/2,
                    y+cell/2
                );
            }
        }
    );
}

/* EYES */

function drawEyes(x,y){

    const o=cell*.16;

    let x1,x2,y1,y2;

    if(direction.x!==0){

        x1=x2=
            x+direction.x*o;

        y1=y-o;
        y2=y+o;

    }else{

        x1=x-o;
        x2=x+o;

        y1=y2=
            y+direction.y*o;
    }

    ctx.fillStyle="#fff8dc";

    ctx.beginPath();

    ctx.arc(
        x1,y1,
        cell*.085,
        0,
        Math.PI*2
    );

    ctx.arc(
        x2,y2,
        cell*.085,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#140f08";

    ctx.beginPath();

    ctx.arc(
        x1+
        direction.x*
        cell*.025,

        y1+
        direction.y*
        cell*.025,

        cell*.04,
        0,
        Math.PI*2
    );

    ctx.arc(
        x2+
        direction.x*
        cell*.025,

        y2+
        direction.y*
        cell*.025,

        cell*.04,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* PARTICLES */

function drawParticles(){

    particles.forEach(p=>{

        ctx.save();

        ctx.globalAlpha=p.life;

        ctx.fillStyle="#e9c46e";

        ctx.shadowColor="#e9c46e";

        ctx.shadowBlur=12;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size*p.life,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    });

    popups.forEach(p=>{

        ctx.save();

        ctx.globalAlpha=p.life;

        ctx.fillStyle="#f4d88f";

        ctx.font=
            "800 17px Inter";

        ctx.textAlign="center";

        ctx.fillText(
            "+1",
            p.x,
            p.y
        );

        ctx.restore();
    });
}

/* ROUNDED RECT */

function roundedRect(
    x,y,w,h,r
){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(
        x+w,y,
        x+w,y+h,
        r
    );

    ctx.arcTo(
        x+w,y+h,
        x,y+h,
        r
    );

    ctx.arcTo(
        x,y+h,
        x,y,
        r
    );

    ctx.arcTo(
        x,y,
        x+w,y,
        r
    );

    ctx.closePath();
}

/* MAIN LOOP */

function draw(time){

    drawBackground();

    drawFood(time);

    drawSnake();

    drawParticles();
}

function loop(time){

    const delta=
        time-lastTime;

    lastTime=time;

    if(running){

        accumulator+=delta;

        while(
            accumulator>=moveInterval
        ){

            update();

            accumulator-=
                moveInterval;
        }
    }

    updateParticles();

    draw(time);

    requestAnimationFrame(loop);
}

/* INIT */

resize();

start();

requestAnimationFrame(loop);

</script>
