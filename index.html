<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>NOIR — Snake</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --gold:#d8b56a;
    --gold2:#f6d995;
    --bg:#050505;
    --panel:rgba(17,17,17,.72);
    --line:rgba(216,181,106,.18);
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    overflow-y:auto;
    background:
        radial-gradient(circle at 50% -10%,rgba(216,181,106,.15),transparent 35%),
        radial-gradient(circle at 10% 80%,rgba(255,255,255,.025),transparent 25%),
        #030303;
    color:#fff;
    font-family:Inter,sans-serif;
}

/* =========================
   LUXURY BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.orb{
    position:absolute;
    width:380px;
    height:380px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.12;
    animation:floatOrb 12s ease-in-out infinite alternate;
}

.orb.one{
    background:#d8b56a;
    top:-180px;
    left:-120px;
}

.orb.two{
    background:#8c6b2e;
    right:-160px;
    bottom:-150px;
    animation-delay:-4s;
}

@keyframes floatOrb{
    from{transform:translate3d(0,0,0) scale(1)}
    to{transform:translate3d(80px,40px,0) scale(1.15)}
}

/* =========================
   INTRO
========================= */

.intro{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#030303;
    transition:opacity 1s ease,visibility 1s ease;
}

.intro.hide{
    opacity:0;
    visibility:hidden;
}

.introInner{
    text-align:center;
    animation:introIn 1.3s cubic-bezier(.2,.8,.2,1);
}

@keyframes introIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.96);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.introSmall{
    font-size:10px;
    letter-spacing:7px;
    color:var(--gold);
    margin-bottom:18px;
    text-transform:uppercase;
}

.introLogo{
    font-family:"Playfair Display",serif;
    font-size:clamp(58px,14vw,110px);
    letter-spacing:12px;
    font-weight:700;
    background:linear-gradient(110deg,#8c6b2e,#fff3c4,#b98a3c);
    -webkit-background-clip:text;
    color:transparent;
}

.introLine{
    width:0;
    height:1px;
    margin:24px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:introLine 1.4s ease .4s forwards;
}

@keyframes introLine{
    to{width:180px}
}

/* =========================
   PAGE
========================= */

.page{
    width:min(100%,720px);
    margin:auto;
    padding:34px 18px 40px;
    opacity:0;
    transform:translateY(20px);
    transition:1s ease;
}

.page.visible{
    opacity:1;
    transform:none;
}

/* =========================
   HEADER
========================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brandMark{
    width:38px;
    height:38px;
    border:1px solid var(--line);
    border-radius:50%;
    display:grid;
    place-items:center;
    color:var(--gold2);
    background:rgba(255,255,255,.025);
    box-shadow:inset 0 0 20px rgba(216,181,106,.05);
}

.brandText{
    line-height:1.05;
}

.brandTitle{
    font-family:"Playfair Display",serif;
    font-size:20px;
    letter-spacing:3px;
}

.brandSub{
    font-size:8px;
    letter-spacing:3px;
    color:#777;
    margin-top:4px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:8px;
    letter-spacing:2px;
    color:#777;
}

.statusDot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#6cff9b;
    box-shadow:0 0 12px #6cff9b;
    animation:pulse 1.8s infinite;
}

@keyframes pulse{
    50%{opacity:.35;transform:scale(.7)}
}

/* =========================
   HERO
========================= */

.hero{
    text-align:center;
    margin-bottom:22px;
}

.eyebrow{
    font-size:9px;
    letter-spacing:6px;
    color:var(--gold);
    margin-bottom:8px;
}

.hero h1{
    font-family:"Playfair Display",serif;
    font-size:clamp(36px,9vw,62px);
    font-weight:600;
    letter-spacing:-1px;
    line-height:1;
}

.hero p{
    margin-top:12px;
    color:#777;
    font-size:11px;
    letter-spacing:1px;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:9px;
    margin-bottom:12px;
}

.stat{
    padding:14px 10px;
    border:1px solid var(--line);
    background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
    backdrop-filter:blur(18px);
    border-radius:15px;
    text-align:center;
}

.statLabel{
    font-size:7px;
    letter-spacing:2px;
    color:#777;
    margin-bottom:5px;
}

.statValue{
    font-size:17px;
    font-weight:700;
}

/* =========================
   GAME FRAME
========================= */

.gameFrame{
    position:relative;
    padding:7px;
    border-radius:25px;
    background:
        linear-gradient(145deg,
        rgba(246,217,149,.6),
        rgba(216,181,106,.08) 25%,
        rgba(255,255,255,.05) 70%,
        rgba(216,181,106,.4));
    box-shadow:
        0 30px 100px rgba(0,0,0,.75),
        0 0 70px rgba(216,181,106,.06);
}

.gameInner{
    position:relative;
    border-radius:19px;
    overflow:hidden;
    background:#060806;
}

canvas{
    display:block;
    width:100%;
    aspect-ratio:1;
    touch-action:none;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(2,2,2,.72);
    backdrop-filter:blur(12px);
    opacity:0;
    pointer-events:none;
    transition:.55s ease;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}

.overlayLabel{
    color:var(--gold);
    letter-spacing:5px;
    font-size:8px;
    margin-bottom:10px;
}

.overlay h2{
    font-family:"Playfair Display",serif;
    font-size:46px;
    margin-bottom:8px;
}

.final{
    color:#888;
    font-size:11px;
    margin-bottom:22px;
}

.final strong{
    color:#fff;
}

.play{
    border:1px solid rgba(246,217,149,.5);
    background:linear-gradient(110deg,#8d6827,#f1d48e,#a87e32);
    color:#080705;
    border-radius:999px;
    padding:13px 28px;
    font-weight:800;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(216,181,106,.15);
    transition:.2s;
}

.play:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(216,181,106,.25);
}

.play:active{
    transform:scale(.95);
}

/* =========================
   CONTROLS
========================= */

.controls{
    margin:18px auto 0;
    width:184px;
    display:grid;
    grid-template-columns:repeat(3,56px);
    grid-template-rows:repeat(2,56px);
    gap:8px;
}

.control{
    border:1px solid rgba(216,181,106,.13);
    background:rgba(255,255,255,.035);
    backdrop-filter:blur(15px);
    border-radius:16px;
    display:grid;
    place-items:center;
    color:#bda568;
    font-size:18px;
    user-select:none;
    transition:.15s;
}

.control:active{
    background:rgba(216,181,106,.15);
    transform:scale(.9);
}

.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}

.tip{
    text-align:center;
    margin-top:13px;
    font-size:8px;
    color:#555;
    letter-spacing:2px;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    margin-top:32px;
    font-size:8px;
    letter-spacing:3px;
    color:#333;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:430px){

    .page{
        padding-top:22px;
    }

    .hero h1{
        font-size:42px;
    }

    .stats{
        gap:6px;
    }

    .stat{
        padding:12px 7px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<!-- CINEMATIC INTRO -->

<div class="intro" id="intro">
    <div class="introInner">
        <div class="introSmall">A DIGITAL EXPERIENCE</div>
        <div class="introLogo">NOIR</div>
        <div class="introLine"></div>
    </div>
</div>

<div class="page" id="page">

    <header class="header">

        <div class="brand">

            <div class="brandMark">✦</div>

            <div class="brandText">
                <div class="brandTitle">NOIR</div>
                <div class="brandSub">CLASSIC ARCADE</div>
            </div>

        </div>

        <div class="status">
            <span class="statusDot"></span>
            ONLINE
        </div>

    </header>

    <section class="hero">

        <div class="eyebrow">THE CLASSIC</div>

        <h1>Snake.</h1>

        <p>Simple rules. Endless pursuit.</p>

    </section>

    <section class="stats">

        <div class="stat">
            <div class="statLabel">SCORE</div>
            <div class="statValue" id="score">000</div>
        </div>

        <div class="stat">
            <div class="statLabel">BEST</div>
            <div class="statValue" id="best">000</div>
        </div>

        <div class="stat">
            <div class="statLabel">SPEED</div>
            <div class="statValue" id="speedText">SLOW</div>
        </div>

    </section>

    <div class="gameFrame">

        <div class="gameInner">

            <canvas id="game"></canvas>

            <div class="overlay" id="overlay">

                <div class="overlayLabel">RUN COMPLETE</div>

                <h2>GAME OVER</h2>

                <div class="final">
                    FINAL SCORE:
                    <strong id="finalScore">000</strong>
                </div>

                <button class="play" id="restart">
                    PLAY AGAIN
                </button>

            </div>

        </div>

    </div>

    <div class="controls">

        <div class="control up" data-dir="up">↑</div>
        <div class="control left" data-dir="left">←</div>
        <div class="control down" data-dir="down">↓</div>
        <div class="control right" data-dir="right">→</div>

    </div>

    <div class="tip">
        SWIPE OR USE ARROW KEYS
    </div>

    <div class="footer">
        NOIR DIGITAL · 2026
    </div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const intro=document.getElementById("intro");
const page=document.getElementById("page");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const speedText=document.getElementById("speedText");
const overlay=document.getElementById("overlay");
const finalScore=document.getElementById("finalScore");

const restart=document.getElementById("restart");

const GRID=24;

let cell=0;
let snake=[];
let food={x:0,y:0};

let direction={x:1,y:0};
let nextDirection={x:1,y:0};

let score=0;
let best=Number(localStorage.getItem("noirSnakeBest")||0);

let running=true;

let lastTime=0;
let timer=0;

/*
   START SLOW
   AND GRADUALLY BECOME FASTER
*/

let speed=180;

let particles=[];
let floating=[];

let touchX=0;
let touchY=0;

bestEl.textContent=String(best).padStart(3,"0");

/* =========================
   INTRO
========================= */

setTimeout(()=>{

    intro.classList.add("hide");

    setTimeout(()=>{
        page.classList.add("visible");
    },350);

},2200);

/* =========================
   CANVAS
========================= */

function resize(){

    const rect=canvas.getBoundingClientRect();

    const dpr=Math.min(window.devicePixelRatio||1,2);

    canvas.width=rect.width*dpr;
    canvas.height=rect.height*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    cell=rect.width/GRID;
}

window.addEventListener("resize",resize);

/* =========================
   GAME INIT
========================= */

function start(){

    snake=[
        {x:12,y:12},
        {x:11,y:12},
        {x:10,y:12}
    ];

    direction={x:1,y:0};
    nextDirection={x:1,y:0};

    score=0;

    /*
      Initially very slow.
    */

    speed=180;

    particles=[];
    floating=[];

    food=randomFood();

    running=true;

    overlay.classList.remove("show");

    updateUI();

    lastTime=performance.now();
    timer=0;
}

/* =========================
   FOOD
========================= */

function randomFood(){

    let p;

    do{

        p={
            x:Math.floor(Math.random()*GRID),
            y:Math.floor(Math.random()*GRID)
        };

    }while(
        snake.some(s=>s.x===p.x&&s.y===p.y)
    );

    return p;
}

/* =========================
   CONTROLS
========================= */

function changeDirection(dir){

    if(!running)return;

    const opposite={
        up:"down",
        down:"up",
        left:"right",
        right:"left"
    };

    const current=
        direction.x===1?"right":
        direction.x===-1?"left":
        direction.y===1?"down":"up";

    if(opposite[current]===dir)return;

    if(dir==="up")nextDirection={x:0,y:-1};
    if(dir==="down")nextDirection={x:0,y:1};
    if(dir==="left")nextDirection={x:-1,y:0};
    if(dir==="right")nextDirection={x:1,y:0};
}

document.addEventListener("keydown",e=>{

    if(e.key==="ArrowUp")changeDirection("up");
    if(e.key==="ArrowDown")changeDirection("down");
    if(e.key==="ArrowLeft")changeDirection("left");
    if(e.key==="ArrowRight")changeDirection("right");

    if(e.key===" "&&!running)start();
});

document.querySelectorAll(".control").forEach(button=>{

    button.addEventListener("pointerdown",e=>{

        e.preventDefault();

        changeDirection(button.dataset.dir);

    });

});

/* =========================
   SWIPE
========================= */

canvas.addEventListener("touchstart",e=>{

    const t=e.touches[0];

    touchX=t.clientX;
    touchY=t.clientY;

},{passive:true});

canvas.addEventListener("touchend",e=>{

    const t=e.changedTouches[0];

    const dx=t.clientX-touchX;
    const dy=t.clientY-touchY;

    if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;

    if(Math.abs(dx)>Math.abs(dy)){

        changeDirection(dx>0?"right":"left");

    }else{

        changeDirection(dy>0?"down":"up");

    }

},{passive:true});

/* =========================
   UPDATE
========================= */

function update(){

    direction=nextDirection;

    const head={
        x:snake[0].x+direction.x,
        y:snake[0].y+direction.y
    };

    /* WALL */

    if(
        head.x<0||
        head.x>=GRID||
        head.y<0||
        head.y>=GRID
    ){

        gameOver();
        return;
    }

    /* BODY */

    if(
        snake.some(s=>s.x===head.x&&s.y===head.y)
    ){

        gameOver();
        return;
    }

    snake.unshift(head);

    /* FOOD */

    if(head.x===food.x&&head.y===food.y){

        score++;

        /*
           Grow snake.
           Speed increases gradually.
        */

        speed=Math.max(
            58,
            180-score*5
        );

        createBurst(
            food.x*cell+cell/2,
            food.y*cell+cell/2
        );

        floating.push({
            x:food.x*cell+cell/2,
            y:food.y*cell+cell/2,
            life:1
        });

        food=randomFood();

        updateUI();

    }else{

        snake.pop();
    }
}

/* =========================
   UI
========================= */

function updateUI(){

    scoreEl.textContent=String(score).padStart(3,"0");

    bestEl.textContent=
        String(Math.max(best,score)).padStart(3,"0");

    let label="SLOW";

    if(score>=15)label="FAST";
    else if(score>=10)label="RAPID";
    else if(score>=5)label="MEDIUM";

    speedText.textContent=label;
}

/* =========================
   GAME OVER
========================= */

function gameOver(){

    running=false;

    finalScore.textContent=
        String(score).padStart(3,"0");

    if(score>best){

        best=score;

        localStorage.setItem(
            "noirSnakeBest",
            best
        );
    }

    createBurst(
        snake[0].x*cell+cell/2,
        snake[0].y*cell+cell/2,
        45
    );

    setTimeout(()=>{
        overlay.classList.add("show");
    },450);
}

restart.addEventListener("click",start);

/* =========================
   PARTICLES
========================= */

function createBurst(x,y,count=24){

    for(let i=0;i<count;i++){

        const a=Math.random()*Math.PI*2;

        const v=Math.random()*4+1;

        particles.push({
            x:x,
            y:y,
            vx:Math.cos(a)*v,
            vy:Math.sin(a)*v,
            life:1,
            size:Math.random()*3+1
        });
    }
}

function updateParticles(){

    particles.forEach(p=>{

        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=.95;
        p.vy*=.95;

        p.life-=.035;
    });

    particles=
        particles.filter(p=>p.life>0);

    floating.forEach(f=>{

        f.y-=.7;
        f.life-=.035;
    });

    floating=
        floating.filter(f=>f.life>0);
}

/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

    const w=canvas.clientWidth;
    const h=canvas.clientHeight;

    ctx.fillStyle="#050805";

    ctx.fillRect(0,0,w,h);

    /* grid */

    ctx.strokeStyle="rgba(216,181,106,.045)";
    ctx.lineWidth=1;

    for(let i=0;i<=GRID;i++){

        ctx.beginPath();
        ctx.moveTo(i*cell,0);
        ctx.lineTo(i*cell,h);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0,i*cell);
        ctx.lineTo(w,i*cell);
        ctx.stroke();
    }

    /* center glow */

    const gradient=
        ctx.createRadialGradient(
            w/2,
            h/2,
            0,
            w/2,
            h/2,
            w*.72
        );

    gradient.addColorStop(
        0,
        "rgba(216,181,106,.07)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(0,0,w,h);
}

/* =========================
   FOOD
========================= */

function drawFood(time){

    const x=food.x*cell+cell/2;
    const y=food.y*cell+cell/2;

    const pulse=
        1+Math.sin(time*.008)*.12;

    ctx.save();

    ctx.shadowColor="#e3b85d";
    ctx.shadowBlur=25;

    const gradient=
        ctx.createRadialGradient(
            x-cell*.08,
            y-cell*.1,
            1,
            x,
            y,
            cell*.34
        );

    gradient.addColorStop(0,"#fff0b5");
    gradient.addColorStop(.25,"#e8c36f");
    gradient.addColorStop(1,"#8d682b");

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        cell*.25*pulse,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    /* tiny orbiting spark */

    const a=time*.003;

    ctx.fillStyle="#fff1ba";

    ctx.beginPath();

    ctx.arc(
        x+Math.cos(a)*cell*.38,
        y+Math.sin(a)*cell*.38,
        1.5,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================
   SNAKE
========================= */

function drawSnake(time){

    snake.forEach((part,index)=>{

        const x=part.x*cell;
        const y=part.y*cell;

        const pad=cell*.075;

        const size=cell*.85;

        const gradient=
            ctx.createLinearGradient(
                x,
                y,
                x+cell,
                y+cell
            );

        if(index===0){

            gradient.addColorStop(0,"#fff0b0");
            gradient.addColorStop(.18,"#e9c36d");
            gradient.addColorStop(.55,"#c69743");
            gradient.addColorStop(1,"#73521f");

        }else{

            gradient.addColorStop(0,"#e2c16e");
            gradient.addColorStop(.5,"#ae8134");
            gradient.addColorStop(1,"#62481f");
        }

        ctx.save();

        ctx.shadowColor=
            index===0
            ?"rgba(246,217,149,.5)"
            :"rgba(216,181,106,.18)";

        ctx.shadowBlur=
            index===0?18:8;

        ctx.fillStyle=gradient;

        roundRect(
            x+pad,
            y+pad,
            size,
            size,
            cell*.23
        );

        ctx.fill();

        ctx.restore();

        /* highlight */

        ctx.fillStyle="rgba(255,255,255,.20)";

        ctx.beginPath();

        ctx.arc(
            x+cell*.29,
            y+cell*.27,
            cell*.065,
            0,
            Math.PI*2
        );

        ctx.fill();

        if(index===0){

            drawHeadEyes(
                x+cell/2,
                y+cell/2
            );
        }
    });
}

/* =========================
   EYES
========================= */

function drawHeadEyes(x,y){

    const off=cell*.16;

    let e1x,e1y,e2x,e2y;

    if(direction.x!==0){

        e1x=e2x=x+direction.x*off;

        e1y=y-off;
        e2y=y+off;

    }else{

        e1x=x-off;
        e2x=x+off;

        e1y=e2y=
            y+direction.y*off;
    }

    ctx.fillStyle="#fff7d6";

    ctx.beginPath();

    ctx.arc(
        e1x,e1y,
        cell*.085,
        0,
        Math.PI*2
    );

    ctx.arc(
        e2x,e2y,
        cell*.085,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#171008";

    ctx.beginPath();

    ctx.arc(
        e1x+direction.x*cell*.025,
        e1y+direction.y*cell*.025,
        cell*.04,
        0,
        Math.PI*2
    );

    ctx.arc(
        e2x+direction.x*cell*.025,
        e2y+direction.y*cell*.025,
        cell*.04,
        0,
        Math.PI*2
    );

    ctx.fill();
}

/* =========================
   PARTICLES
========================= */

function drawParticles(){

    particles.forEach(p=>{

        ctx.save();

        ctx.globalAlpha=p.life;

        ctx.fillStyle="#e8c36f";

        ctx.shadowColor="#e8c36f";
        ctx.shadowBlur=12;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size*p.life,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    });

    floating.forEach(f=>{

        ctx.save();

        ctx.globalAlpha=f.life;

        ctx.fillStyle="#f6d995";

        ctx.font="800 17px Inter";

        ctx.textAlign="center";

        ctx.fillText(
            "+1",
            f.x,
            f.y
        );

        ctx.restore();
    });
}

/* =========================
   ROUNDED RECT
========================= */

function roundRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(
        x+w,y,
        x+w,y+h,
        r
    );

    ctx.arcTo(
        x+w,y+h,
        x,y+h,
        r
    );

    ctx.arcTo(
        x,y+h,
        x,y,
        r
    );

    ctx.arcTo(
        x,y,
        x+w,y,
        r
    );

    ctx.closePath();
}

/* =========================
   MAIN LOOP
========================= */

function draw(time){

    drawBackground();

    drawFood(time);

    drawSnake(time);

    drawParticles();
}

function loop(time){

    const delta=time-lastTime;

    lastTime=time;

    if(running){

        timer+=delta;

        while(timer>=speed){

            update();

            timer-=speed;
        }
    }

    updateParticles();

    draw(time);

    requestAnimationFrame(loop);
}

/* =========================
   START
========================= */

resize();

start();

requestAnimationFrame(loop);

</script>
